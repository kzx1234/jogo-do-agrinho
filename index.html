<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda do Agrinho</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #244714;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Interface Principal (HUD) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 3px solid #ffd700;
            z-index: 10;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            max-width: 420px;
        }
        #hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        #hud h2 { margin: 0; color: #5cb85c; font-size: 22px; text-shadow: 2px 2px #000;}
        
        #btn-minimizar {
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn-minimizar:hover { background: #ffea63; }
        #hud p { margin: 6px 0; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px;}

        /* --- HOTBAR ESTILO MINECRAFT --- */
        #hotbar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 40, 40, 0.9);
            padding: 6px;
            border-radius: 6px;
            border: 4px solid #4a4a4a;
            display: flex;
            gap: 6px;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .hotbar-slot {
            width: 60px;
            height: 60px;
            background: rgba(139, 139, 139, 0.5);
            border: 3px solid #373737;
            border-top-color: #8b8b8b;
            border-left-color: #8b8b8b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            position: relative;
            cursor: pointer;
        }
        .hotbar-slot.selecionado {
            border: 4px solid #ffffff;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8);
            background: rgba(200, 200, 200, 0.4);
        }
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
        }
        .slot-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
        }

        /* --- INVENTÁRIO / MOCHILA MODAL --- */
        #mochila-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #8b8b8b;
            border: 6px solid #4a4a4a;
            padding: 20px;
            z-index: 150;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 380px;
            border-radius: 4px;
        }
        #mochila-modal h3 {
            margin-top: 0;
            color: #fff;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .mochila-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #4a4a4a;
            padding: 12px;
            border-radius: 4px;
        }
        .mochila-slot {
            height: 70px;
            background: #8b8b8b;
            border: 3px solid #373737;
            border-top-color: #dbdbdb;
            border-left-color: #dbdbdb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            position: relative;
            cursor: pointer;
        }
        .mochila-slot:hover {
            background: #999;
        }

        /* Cenário Gráfico da Fazenda */
        #cenario {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #629632;
            background-image: 
                radial-gradient(#56872a 15%, transparent 16%),
                radial-gradient(#56872a 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            border: 20px solid #5a3d28;
        }

        /* Personagens */
        .character {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        #player {
            background: #2196F3;
            border: 3px solid #0d47a1;
            z-index: 5;
        }
        #vendedor {
            background: #ff9800;
            border: 3px solid #e65100;
            left: 80%;
            top: 15%;
        }
        .balao-npc {
            position: absolute;
            top: -45px;
            background: white;
            color: #333;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            border: 2px solid #e65100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Área de Plantio Centralizada na Tela */
        #zona-plantio {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-gap: 15px;
            background: #4a3319;
            padding: 20px;
            border-radius: 15px;
            border: 6px solid #362411;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.3);
        }
        .slot {
            width: 90px;
            height: 90px;
            background-color: #6e4726;
            border: 3px dashed #362411;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .slot:hover { 
            background-color: #825530;
            transform: scale(1.05);
        }
        .slot .status { 
            font-size: 11px; 
            margin-top: 6px; 
            background: rgba(0,0,0,0.7); 
            padding: 2px 6px; 
            border-radius: 4px;
            font-weight: bold;
        }

        /* Janela da Loja (Modal) */
        #loja-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            z-index: 100;
            width: 360px;
            border: 5px solid #ff9800;
        }
        #loja-modal h3 { margin-top: 0; color: #e65100; text-align: center; font-size: 24px; margin-bottom: 20px;}
        
        .item-loja {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background: #f7f7f7;
            border: 2px solid #eaeaea;
            border-radius: 8px;
        }
        .item-loja span {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-comprar {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-comprar:hover { background: #45a049; transform: scale(1.05); }
        
        .btn-fechar {
            width: 100%;
            background: #f44336;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-fechar:hover { background: #d32f2f; }

        /* Painel de Controles */
        #controles {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            border-left: 5px solid #2196F3;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="cenario">
        <!-- HUD Superior -->
        <div id="hud">
            <div id="hud-header">
                <h2>Fazenda do Agrinho 🌾</h2>
